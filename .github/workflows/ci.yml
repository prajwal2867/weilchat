name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-and-redis:
    name: Unit and Redis integration tests
    runs-on: ubuntu-latest
    env:
      REDIS_TEST_URL: \${{ secrets.REDIS_TEST_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit and local integration tests
        run: npm test
      - name: Run cross-instance Redis integration test
        if: \${{ env.REDIS_TEST_URL != '' }}
        run: npm run test:redis

  browser:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run two-browser end-to-end test
        run: npm run test:e2e
